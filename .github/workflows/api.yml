name: Deploy Pigeon Reels API

# يُشغَّل يدوياً من تبويب Actions بعد إضافة أسرار Cloudflare.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pigeon-reels-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Python Worker to Cloudflare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 1. Get the code
        uses: actions/checkout@v4

      - name: 2. Check the Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions, then run this workflow again."
            exit 1
          fi

      - name: 3. Install uv
        uses: astral-sh/setup-uv@v6

      - name: 4. Install the Python Worker toolchain
        run: uv sync

      - name: 5. Create the R2 bucket (kept if it already exists)
        continue-on-error: true
        run: npx --yes wrangler@4 r2 bucket create pigeon-reels
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 6. Deploy the Worker
        run: uv run pywrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
