name: Deploy Pigeon Reels API

# يُشغَّل يدوياً من تبويب Actions بعد إضافة أسرار Cloudflare.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pigeon-reels-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Python Worker to Cloudflare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - name: 1. Get the code
        uses: actions/checkout@v4

      - name: 2. Check the Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions, then run this workflow again."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && { [ -z "$CLOUDFLARE_EMAIL" ] || [ -z "$CLOUDFLARE_API_KEY" ]; }; then
            echo "::error::Add either CLOUDFLARE_API_TOKEN or the pair CLOUDFLARE_EMAIL + CLOUDFLARE_API_KEY, then run this workflow again."
            exit 1
          fi
          if [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "::warning::IG_ACCESS_TOKEN is missing. The worker will archive reels but cannot publish them to Instagram until you add it."
          fi
          echo "Credentials found; deploying."

      - name: 3. Install uv
        uses: astral-sh/setup-uv@v6

      - name: 4. Install the Python Worker toolchain
        run: uv sync

      - name: 5. Create the R2 bucket (kept if it already exists)
        continue-on-error: true
        run: npx --yes wrangler@4 r2 bucket create water

      - name: 6. Deploy the Worker
        run: uv run pywrangler deploy

      - name: 7. Store the Instagram publishing token
        if: env.IG_ACCESS_TOKEN != ''
        run: printf '%s' "$IG_ACCESS_TOKEN" | npx --yes wrangler@4 secret put IG_ACCESS_TOKEN
