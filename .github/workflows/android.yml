name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: 1. Get the code
        uses: actions/checkout@v4

      - name: 2. Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 3. Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: 4. Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: 5. Build the APK
        run: gradle --no-daemon assembleDebug

      - name: 6. Show the APK
        run: ls -lh app/build/outputs/apk/debug/

      - name: 7. Upload the APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: brainrot-pigeon-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 8. Publish the APK as the "latest" release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          body: >
            أحدث نسخة مبنية من ${{ github.sha }}.
            حمّل app-debug.apk من قسم Assets وثبّتها على هاتف Android 8.0+.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
