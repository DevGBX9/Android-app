<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@brainrot.pigeon</title>
  <style>
    :root {
      --bg: #0c1015;
      --text: #f5f5f5;
      --bubble: #2b3136;
      --bubble-text: #c9ced3;
      --avatar: 88px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
        Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 32px;
    }

    .sheet {
      width: 100%;
      max-width: 430px;
    }

    .profile {
      display: flex;
      align-items: flex-start;
      gap: 24px;
    }

    /* ---------- left column: note + avatar ---------- */

    .profile__left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      flex: 0 0 auto;
    }

    .note {
      width: calc(var(--avatar) + 6px);
      min-height: calc(var(--avatar) * 0.57);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 6px 10px;
      border-radius: 22px;
      background: var(--bubble);
      color: var(--bubble-text);
      font-size: 15px;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .avatar {
      position: relative;
      width: var(--avatar);
      height: var(--avatar);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .avatar__plus {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 21px;
      height: 21px;
      display: grid;
      place-items: center;
      border: 2px solid var(--bg);
      border-radius: 50%;
      background: #f5f5f5;
      cursor: pointer;
      padding: 0;
    }

    .avatar__plus svg {
      width: 12px;
      height: 12px;
      stroke: #0c1015;
      stroke-width: 2.6;
      fill: none;
      stroke-linecap: round;
    }

    /* ---------- right column: name + stats ---------- */

    .profile__right {
      padding-top: 34px;
      min-width: 0;
    }

    .username {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.1px;
    }

    .verified {
      width: 17px;
      height: 17px;
      color: #f5f5f5;
      flex: 0 0 auto;
    }

    .stats {
      display: flex;
      gap: 30px;
      list-style: none;
      margin-top: 18px;
    }

    .stats li {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 17px;
      line-height: 1.25;
      white-space: nowrap;
    }

    .stats b {
      font-weight: 700;
    }

    .stats span {
      font-weight: 400;
    }

    .bio {
      margin-top: 14px;
      font-size: 15px;
      line-height: 1.35;
      color: var(--text);
    }

    @media (max-width: 380px) {
      :root {
        --avatar: 78px;
      }

      .stats {
        gap: 20px;
      }

      .stats li,
      .username {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <section class="profile" aria-label="Profile stats for @brainrot.pigeon">
      <div class="profile__left">
        <div class="note" id="note"></div>
        <div class="avatar">
          <img id="avatar" src="assets/avatar.webp" alt="brainrot.pigeon profile picture" />
          <button class="avatar__plus" type="button" aria-label="Add to story">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
        </div>
      </div>

      <div class="profile__right">
        <h1 class="username">
          <span id="username"></span>
          <svg class="verified" viewBox="0 0 24 24" role="img" aria-label="Verified">
            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-dasharray="2.4 2.6" />
            <path d="M7.6 12.3l2.9 2.9 5.9-6.1" fill="none" stroke="currentColor"
                  stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </h1>

        <ul class="stats">
          <li><b id="posts"></b><span>posts</span></li>
          <li><b id="followers"></b><span>followers</span></li>
          <li><b id="following"></b><span>following</span></li>
        </ul>
      </div>
    </section>

    <p class="bio" id="bio"></p>
  </main>

  <script>
    // ═══════════════════════════════════════════════════════════
    //  حساب إنستغرام لايف عبر Instagram Graph API الرسمي
    // ═══════════════════════════════════════════════════════════
    const CONFIG = {
      username: "brainrot.pigeon",
      igUserId: "17841438848736931",
      accessToken: "EAAXjGpto53wBTKzOQ0vN2odWZB83dZA2Ba3C9mNfkKG6SZCifZCWmZACCZBVxjgU5o2egSEQAWI92dZAZBnzyX7RPpB9Bbn7oNIiE5G7I2BB1r8qX2JZC67n3OT3vd13a0JCfcBLdPrQyg4Wl0tTbs7FpcZB4yQmpWOjIUooYvlgzsqGd9B4xVsZAFXfU83ZCXyidHLSx72yPwNfAUV6PIkzEQ15yIfMZAGZAEsxbI2amOQLevUnJt4Mkn1wZDZD",
      apiVersion: "v27.0",
      apiBase: "https://graph.facebook.com",

      // كل كم نحدّث البيانات (بالميلي ثانية)
      refreshMs: 10 * 60 * 1000, // 10 دقايق
    };

    // بيانات احتياطية تظهر فوراً قبل ما يرجع الرد (أو لو النت مقطوع / التوكن غير صالح)
    const FALLBACK = {
      username: CONFIG.username,
      bio: "I'm a pigeon",
      posts: 48,
      followers: 3067,
      following: 5,
      avatar: "",
    };

    const LOCAL_AVATAR = "assets/avatar.webp";
    const CACHE_KEY = "brainrot.pigeon:profile:ig:v1";
    const noteText = "Can't decide...";

    const els = {
      username: document.getElementById("username"),
      posts: document.getElementById("posts"),
      followers: document.getElementById("followers"),
      following: document.getElementById("following"),
      bio: document.getElementById("bio"),
      note: document.getElementById("note"),
      avatar: document.getElementById("avatar"),
    };

    const format = (n) =>
      typeof n === "number" && Number.isFinite(n) ? n.toLocaleString("en-US") : "—";

    let currentAvatar = LOCAL_AVATAR;
    els.avatar.referrerPolicy = "no-referrer";

    function setAvatar(url) {
      if (!url || url === currentAvatar) return;
      currentAvatar = url;
      els.avatar.src = url;
    }

    function render(data) {
      els.username.textContent = data.username || FALLBACK.username;
      els.posts.textContent = format(data.posts);
      els.followers.textContent = format(data.followers);
      els.following.textContent = format(data.following);
      els.bio.textContent = data.bio ?? FALLBACK.bio;
      els.note.textContent = noteText;
      document.title = "@" + (data.username || FALLBACK.username);
      if (data.avatar) setAvatar(data.avatar);
    }

    function showCached() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (raw) return render(JSON.parse(raw));
      } catch (_) {}
      render(FALLBACK);
    }

    function saveCache(data) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
      } catch (_) {}
    }

    async function fetchProfile() {
      const fields = "id,username,name,profile_picture_url,biography,followers_count,follows_count,media_count";
      const url = `${CONFIG.apiBase}/${CONFIG.apiVersion}/${CONFIG.igUserId}?fields=${fields}&access_token=${encodeURIComponent(CONFIG.accessToken)}`;

      const res = await fetch(url, { cache: "no-store" });
      const json = await res.json();

      if (!res.ok || json.error) {
        const detail = json?.error?.message || "";
        throw new Error(`HTTP ${res.status}${detail ? ": " + detail : ""}`);
      }

      return {
        username: json.username || CONFIG.username,
        bio: json.biography ?? "",
        posts: json.media_count,
        followers: json.followers_count,
        following: json.follows_count,
        avatar: json.profile_picture_url || "",
      };
    }

    async function syncProfile() {
      try {
        const data = await fetchProfile();
        render(data);
        saveCache(data);
      } catch (err) {
        console.warn("[brainrot.pigeon] تعذّر تحديث البيانات:", err.message);
        if (els.username.textContent === "") render(FALLBACK);
      }
    }

    els.avatar.addEventListener("error", () => {
      if (els.avatar.getAttribute("src") !== LOCAL_AVATAR) {
        currentAvatar = LOCAL_AVATAR;
        els.avatar.src = LOCAL_AVATAR;
      }
    });

    showCached();
    syncProfile();
    setInterval(syncProfile, CONFIG.refreshMs);

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") syncProfile();
    });
  </script>
</body>
</html>
